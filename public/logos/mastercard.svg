<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <clipPath id="mc-clip-left">
      <circle cx="190" cy="130" r="95" />
    </clipPath>
  </defs>
  <!-- Background transparent or light container -->
  <!-- Left circle Red -->
  <circle cx="190" cy="130" r="95" fill="#EB001B" />
  <!-- Right circle Yellow -->
  <circle cx="310" cy="130" r="95" fill="#F79E1B" />
  <!-- Center Intersection Orange -->
  <circle cx="310" cy="130" r="95" clip-path="url(#mc-clip-left)" fill="#FF5F00" />

  <!-- mastercard wordmark text -->
  <text x="250" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="500" fill="#111827" text-anchor="middle" letter-spacing="-1.5">mastercard</text>
</svg>
