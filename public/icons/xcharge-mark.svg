<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pwaCyanBlade" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#00d2ff" />
      <stop offset="60%" stopColor="#00f0ff" />
      <stop offset="100%" stopColor="#55f5ff" />
    </linearGradient>
    <linearGradient id="pwaWhiteBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#cbd5e1" />
    </linearGradient>
    <radialGradient id="pwaGlowBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#00f0ff" stopOpacity="0.25" />
      <stop offset="60%" stopColor="#00f0ff" stopOpacity="0.05" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0" />
    </radialGradient>
    <filter id="pwaBladeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Hypercharge OS Deep Obsidian Background -->
  <rect width="512" height="512" fill="#10141a" />
  <circle cx="256" cy="256" r="220" fill="url(#pwaGlowBg)" />

  <!-- Aerodynamic X-Blade Glyph Centered -->
  <g transform="translate(256, 256) scale(5.8) translate(-49, -45)">
    <!-- Top-Left White Wing -->
    <path
      d="M 32 24 L 46 24 C 49 24 51 27 49 30 L 44 38 C 42 41 38 41 36 38 L 30 29 C 29 27 30 24 32 24 Z"
      fill="url(#pwaWhiteBlade)"
    />
    <!-- Bottom-Right White Wing -->
    <path
      d="M 52 48 L 57 44 C 59 42 63 43 65 46 L 70 54 C 71 56 70 59 67 59 L 58 59 C 55 59 53 56 55 53 Z"
      fill="url(#pwaWhiteBlade)"
    />
    <!-- Cyan Main Diagonal Blade -->
    <path
      d="M 28 64 L 42 46 C 44 43 47 41 50 39 L 68 25 C 71 23 74 25 73 28 L 68 34 C 66 36 63 38 60 41 L 44 60 C 42 63 38 65 34 66 L 27 67 C 25 67 25 65 28 64 Z"
      fill="url(#pwaCyanBlade)"
      filter="url(#pwaBladeGlow)"
    />
  </g>
</svg>
